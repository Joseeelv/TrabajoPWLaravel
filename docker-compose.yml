services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: kebab-laravel-app
        container_name: kebab_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        ports:
            - "9000:9000"
        env_file:
            - .env
        depends_on:
            - db

    db:
        image: mysql:8.0
        container_name: kebab_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: DB_KEBAB
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: kebabuser
            MYSQL_PASSWORD: kebabpassword
        ports:
            - "3306:3306"
        volumes:
            - db_data:/var/lib/mysql

    nginx:
        image: nginx:alpine
        container_name: kebab_nginx
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ./:/var/www
            - ./nginx:/etc/nginx/conf.d
        depends_on:
            - app

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: kebab_phpmyadmin
        restart: unless-stopped
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
        ports:
            - "8080:80"
        depends_on:
            - db

volumes:
    db_data:
